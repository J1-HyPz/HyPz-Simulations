services:
  sim:
    build: .
    image: hypz-sim:latest
    container_name: hypz-sim
    # Match the host `claude` user so bind-mounted files stay owned correctly.
    user: "3003:3001"
    working_dir: /app
    volumes:
      - ./:/app
      - ../data:/data
    environment:
      HYPZ_DB: /data/db/sim.db
      HYPZ_RAW: /data/raw
      PYTHONPATH: /app/src
      TZ: Europe/London
      HYPZ_WEB_OUT: /data/web/fixture-model.html
      API_FOOTBALL_KEY: ${API_FOOTBALL_KEY:-}
      HIGHLIGHTLY_KEY: ${HIGHLIGHTLY_KEY:-}
      HIGHLIGHTLY_LEAGUE_ID: ${HIGHLIGHTLY_LEAGUE_ID:-}
      HYPZ_LINEUP_PROVIDER: ${HYPZ_LINEUP_PROVIDER:-auto}
      HYPZ_RUN_ON_START: "1"
    # The scheduler is the container's main process; CLI work still goes through
    # `docker exec`. If it exits, restart brings it back.
    command: ["python", "-m", "hypz.scheduler"]
    restart: unless-stopped

  # Serving is a separate process from ingestion on purpose (design doc section 3):
  # they share only the database, and either can be down without the other caring.
  api:
    build: .
    image: hypz-sim:latest
    container_name: hypz-api
    user: "3003:3001"
    working_dir: /app
    volumes:
      - ./:/app
      - ../data:/data
    environment:
      HYPZ_DB: /data/db/sim.db
      HYPZ_RAW: /data/raw
      PYTHONPATH: /app/src
      TZ: Europe/London
      API_FOOTBALL_KEY: ${API_FOOTBALL_KEY:-}
      HIGHLIGHTLY_KEY: ${HIGHLIGHTLY_KEY:-}
      HIGHLIGHTLY_LEAGUE_ID: ${HIGHLIGHTLY_LEAGUE_ID:-}
      HYPZ_LINEUP_PROVIDER: ${HYPZ_LINEUP_PROVIDER:-auto}
    command: ["uvicorn", "hypz.api:app", "--host", "0.0.0.0", "--port", "8000",
              "--proxy-headers", "--log-level", "info"]
    ports:
      - "8099:8000"
    restart: unless-stopped
